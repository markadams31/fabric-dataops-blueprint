# Promote a bundle that already proved itself in dev to test, then prod — the
# identical bytes, nothing rebuilt. Each environment pauses for its reviewers.
# Rollback is this same workflow pointed at an earlier build run.
name: promote
on:
  workflow_dispatch:
    inputs:
      solution:
        description: solution to promote
        default: sales
        required: true
      run_id:
        description: build run ID whose bundle to promote (must be green)
        required: true

permissions:
  contents: read
  actions: read

jobs:
  provenance:
    runs-on: ubuntu-latest
    outputs:
      artifact: ${{ steps.check.outputs.artifact }}
      sha: ${{ steps.check.outputs.sha }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
          SOLUTION: ${{ inputs.solution }}
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[0-9]+$ ]] || { echo "run_id must be numeric"; exit 1; }
          [[ "$SOLUTION" =~ ^[a-z][a-z0-9]*$ ]] || { echo "invalid solution name"; exit 1; }
          run=$(gh api "repos/${{ github.repository }}/actions/runs/$RUN_ID")
          path=$(echo "$run" | jq -r .path)
          branch=$(echo "$run" | jq -r .head_branch)
          event=$(echo "$run" | jq -r .event)
          sha=$(echo "$run" | jq -r .head_sha)
          # Per-solution provenance: bundles are per solution, so judge THIS
          # solution's dev deploy — a sibling solution's red must not freeze it.
          job=$(gh api "repos/${{ github.repository }}/actions/runs/$RUN_ID/jobs" --paginate \
            --jq ".jobs[] | select(.name == \"deploy-dev ($SOLUTION) / deploy\") | .conclusion" | head -1)
          [ "$job" = "success" ] || { echo "run $RUN_ID: dev deploy for $SOLUTION concluded '${job:-absent}' — only dev-proven bundles promote"; exit 1; }
          [ "$path" = ".github/workflows/build-and-deploy.yml" ] && [ "$branch" = "main" ] || {
            echo "run $RUN_ID is not a build of main ($path @ $branch) — refusing"; exit 1; }
          echo "artifact=$SOLUTION-$sha" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "promoting $SOLUTION-$sha from run $RUN_ID ($event on $branch)"

  test:
    needs: provenance
    permissions:
      id-token: write
      contents: read
      actions: read
    uses: ./.github/workflows/deploy-env.yml
    with:
      solution: ${{ inputs.solution }}
      environment: test
      artifact: ${{ needs.provenance.outputs.artifact }}
      run_id: ${{ inputs.run_id }}

  prod:
    needs: [provenance, test]
    permissions:
      id-token: write
      contents: read
      actions: read
    uses: ./.github/workflows/deploy-env.yml
    with:
      solution: ${{ inputs.solution }}
      environment: prod
      artifact: ${{ needs.provenance.outputs.artifact }}
      run_id: ${{ inputs.run_id }}

  # GitHub stamps a deployment with the ref the workflow ran from, which for a
  # rollback is today's main rather than the bundle being deployed. The ledger is
  # what the production schedule trusts to decide which commit to operate, so
  # record what was actually promoted.
  record:
    needs: [provenance, prod]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    strategy:
      matrix:
        environment: [test, prod]
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          d=$(gh api "repos/${{ github.repository }}/deployments?environment=${{ inputs.solution }}-${{ matrix.environment }}&per_page=1" --jq '.[0].id')
          gh api -X POST "repos/${{ github.repository }}/deployments/$d/statuses" \
            -f state=success -f description="bundle ${{ needs.provenance.outputs.sha }}" >/dev/null
          echo "${{ inputs.solution }}-${{ matrix.environment }} runs bundle ${{ needs.provenance.outputs.sha }}"
