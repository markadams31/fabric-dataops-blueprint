# The production heartbeat: resume the capacity, run ingestion and rebuild the
# marts with their tests, as the platform identity. Failures open an issue.
name: prod-schedule
on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  issues: write

jobs:
  solutions:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.ls.outputs.list }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: ls
        run: |
          list=$(ls -d solutions/*/ | xargs -n1 basename | grep -vx '_template' | grep -Ex '[a-z][a-z0-9-]+' | jq -R . | jq -sc .)
          echo "list=$list" >> "$GITHUB_OUTPUT"

  operate:
    needs: solutions
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        solution: ${{ fromJSON(needs.solutions.outputs.list) }}
    concurrency: deploy-${{ matrix.solution }}-prod
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.9.26"
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID_PLATFORM }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: resume capacity
        run: |
          az rest --method post --url "https://management.azure.com/subscriptions/${{ vars.AZURE_SUBSCRIPTION_ID }}/resourceGroups/${{ vars.FABRIC_RESOURCE_GROUP }}/providers/Microsoft.Fabric/capacities/${{ vars.FABRIC_CAPACITY_NAME }}/resume?api-version=2023-11-01" -o none 2>/dev/null || true
          for i in $(seq 1 30); do
            S=$(az rest --method get --url "https://management.azure.com/subscriptions/${{ vars.AZURE_SUBSCRIPTION_ID }}/resourceGroups/${{ vars.FABRIC_RESOURCE_GROUP }}/providers/Microsoft.Fabric/capacities/${{ vars.FABRIC_CAPACITY_NAME }}?api-version=2023-11-01" --query properties.state -o tsv)
            [ "$S" = "Active" ] && break; sleep 5
          done; echo "capacity: $S"
      - run: uv sync --frozen --no-dev
      - name: operate ${{ matrix.solution }} prod
        run: uv run python deploy/operate.py --solution ${{ matrix.solution }} --environment prod
      - name: notify on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "${{ github.repository }}" \
            --title "prod-schedule failed (${{ matrix.solution }}): $(date -u +%F)" \
            --body "Scheduled operations failed — https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" || true
