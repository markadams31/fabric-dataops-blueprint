# Deploy one solution's bundle to one environment, as that solution's own
# identity. Reusable: build-and-deploy.yml calls it for dev, promotion will call it for
# test and prod with the identical bundle.
name: deploy-env
on:
  workflow_call:
    inputs:
      solution:
        type: string
        required: true
      environment:
        type: string
        required: true
      artifact:
        type: string
        required: true
      run_id:
        description: run to download the bundle from (defaults to the current run)
        type: string
        required: false
        default: ""

permissions:
  id-token: write
  contents: read
  actions: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # The environment supplies the OIDC subject (and, for test/prod, the approval
    # gate) — and every deployment lands in GitHub's Deployments ledger.
    environment: ${{ inputs.solution }}-${{ inputs.environment }}
    concurrency: deploy-${{ inputs.solution }}-${{ inputs.environment }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.9.26"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.artifact }}
          path: dist/
          run-id: ${{ inputs.run_id || github.run_id }}
          github-token: ${{ github.token }}
      # Deploy identities hold no Azure RBAC at all — they exist only for Fabric.
      # A tenant-level login is exactly that, hence allow-no-subscriptions.
      - uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2
        with:
          client-id: ${{ vars[format('AZURE_CLIENT_ID_{0}', inputs.solution)] }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - run: uv sync --frozen --no-dev
      - name: deploy the bundle
        run: |
          uv run python deploy/deploy.py \
            --bundle dist/${{ inputs.solution }}-*.tar.gz \
            --manifest dist/release-manifest.json \
            --solution ${{ inputs.solution }} \
            --environment ${{ inputs.environment }}

      # Stands in for ingestion, and deliberately not part of the deploy above: a
      # deploy rebuilds derived data, but writing *source* data from the release
      # path means a redeploy can overwrite Bronze. A real solution deletes this
      # step and lets its own ingestion fill the lakehouse.
      - name: seed demo source data
        run: |
          uv run python deploy/seed.py \
            --solution ${{ inputs.solution }} \
            --environment ${{ inputs.environment }}

      - name: build and test the marts
        run: |
          uv run python deploy/run_dbt.py \
            --bundle dist/${{ inputs.solution }}-*.tar.gz \
            --solution ${{ inputs.solution }} \
            --environment ${{ inputs.environment }}
