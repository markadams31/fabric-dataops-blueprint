# Re-test the platform assumptions the documentation rests on, as a deploy
# identity. Manual: it costs capacity time and answers questions that only
# change when Fabric does. See deploy/probe.py for what each probe asks.
name: verify-claims

on:
  workflow_dispatch:
    inputs:
      solution:
        description: solution whose deploy identity to probe as
        type: string
        default: sales
      workspace:
        description: workspace to probe
        type: string
        default: ws-sales-dev

permissions:
  contents: read
  id-token: write

jobs:
  probe:
    runs-on: ubuntu-latest
    environment: ${{ inputs.solution }}-dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      - run: uv sync --frozen
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars[format('AZURE_CLIENT_ID_{0}', inputs.solution)] }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: probe
        run: uv run python deploy/probe.py --workspace "${{ inputs.workspace }}"
