# Re-test the platform assumptions the documentation rests on, as a deploy
# identity. Manual: it costs capacity time and answers questions that only
# change when Fabric does. See deploy/probe.py for what each probe asks.
name: verify-claims

on:
  workflow_dispatch:
    inputs:
      solution:
        description: solution whose deploy identity to probe as
        type: string
        default: sales
      workspace:
        description: workspace to probe
        type: string
        default: ws-sales-dev

permissions:
  contents: read
  id-token: write

jobs:
  probe:
    runs-on: ubuntu-latest
    environment: ${{ inputs.solution }}-dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - run: uv sync --frozen
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ vars[format('AZURE_CLIENT_ID_{0}', inputs.solution)] }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: probe
        run: uv run python deploy/probe.py --workspace "${{ inputs.workspace }}"
