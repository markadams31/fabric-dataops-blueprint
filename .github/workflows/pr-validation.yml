# Everything a pull request must prove, with no cloud access: the same commands
# a developer can run locally with uv run.
name: pr-validation
on: pull_request

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.9.26"
      - run: uv sync --frozen
      - name: ruff
        run: uv run ruff check .
      - name: tests
        run: uv run pytest -q
      - name: guards
        run: uv run python deploy/guards.py
      - name: dbt parse (offline)
        env:
          DBT_FABRIC_SERVER: placeholder.datawarehouse.fabric.microsoft.com
          DBT_FABRIC_DATABASE: placeholder
          DBT_LAKEHOUSE_FILES: abfss://placeholder@onelake.dfs.fabric.microsoft.com/placeholder/Files
        run: |
          for project in solutions/*/dbt/*/; do
            echo "== $project"
            uv run dbt parse --no-use-colors --profiles-dir "$project" --project-dir "$project"
          done

  # Separate from validate so a scanner pulling an image never slows the fast
  # checks. Both are required by the protect-main ruleset.
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # gitleaks scans history, not just the diff

      # This repository's central claim is that no secret exists to leak. This is
      # the check that proves it, over every commit rather than the current tree.
      # Run as a digest-pinned container rather than the action: no token, no
      # licence handling, and the image is pinned the way this repository pins
      # every other third-party thing.
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" \
            zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            detect --source /repo --redact --no-banner --exit-code 1

      # Dependabot reports a vulnerable dependency after the fact; this refuses to
      # merge one. Reads uv.lock, which is the pinned toolchain an artefact records.
      - name: trivy
        run: |
          docker run --rm -v "$PWD:/repo" \
            aquasec/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 \
            fs --scanners vuln,secret --severity HIGH,CRITICAL \
            --ignore-unfixed --exit-code 1 --no-progress /repo
