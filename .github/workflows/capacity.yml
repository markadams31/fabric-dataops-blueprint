# Cost control: pause the capacity nightly (after the prod schedule); resume on
# demand — the fix for every "capacity isn't available" moment.
name: capacity
on:
  schedule:
    - cron: "0 20 * * *"
  workflow_dispatch:
    inputs:
      action:
        type: choice
        options: [resume, pause, status]
        default: status

permissions:
  id-token: write
  contents: read

jobs:
  capacity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID_PLATFORM }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: ${{ inputs.action || 'pause' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ inputs.action || 'pause' }}" = "pause" ]; then
            # Match on workflow PATH, not display name: a rename would silently
            # empty this check. And a promote waiting on its approval gate is
            # "waiting", not "in_progress" — approve at 21:00, deploy into a
            # capacity paused at 20:00.
            BUSY=0
            for S in in_progress queued waiting; do
              N=$(gh api "repos/${{ github.repository }}/actions/runs?status=$S&per_page=30" \
                --jq '[.workflow_runs[] | select(.path==".github/workflows/build.yml" or .path==".github/workflows/promote.yml" or .path==".github/workflows/prod-schedule.yml")] | length')
              BUSY=$((BUSY + N))
            done
            if [ "$BUSY" != "0" ]; then echo "deploys in flight or awaiting approval ($BUSY) — skipping pause"; exit 0; fi
          fi
          BASE="https://management.azure.com/subscriptions/${{ vars.AZURE_SUBSCRIPTION_ID }}/resourceGroups/${{ vars.FABRIC_RESOURCE_GROUP }}/providers/Microsoft.Fabric/capacities/${{ vars.FABRIC_CAPACITY_NAME }}"
          ACTION="${{ inputs.action || 'pause' }}"
          case "$ACTION" in
            resume) az rest --method post --url "$BASE/resume?api-version=2023-11-01" -o none 2>/dev/null || true ;;
            pause)  az rest --method post --url "$BASE/suspend?api-version=2023-11-01" -o none 2>/dev/null || true ;;
          esac
          sleep 5
          STATE=$(az rest --method get --url "$BASE?api-version=2023-11-01" --query properties.state -o tsv)
          echo "state: $STATE"
          if [ "$ACTION" = "pause" ] && [ "$STATE" != "Paused" ] && [ "$STATE" != "Pausing" ]; then
            echo "pause did not take effect"; exit 1
          fi
