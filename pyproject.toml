[project]
name = "fabric-dataops-blueprint"
version = "0.0.1"
description = "Deployment tooling for the Fabric DataOps Blueprint"
requires-python = ">=3.12"
dependencies = [
    "fabric-cicd==1.3.0",
    "azure-identity>=1.17",
    "requests>=2.32",
    "dbt-fabric==1.11.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 120
# Fabric notebook source files run inside the Fabric runtime, where `spark` and
# `notebookutils` are ambient globals — they are not standalone Python modules.
extend-exclude = ["*.Notebook"]

[tool.pytest.ini_options]
testpaths = ["tests"]
