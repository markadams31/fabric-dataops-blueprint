[project]
name = "fabric-dataops-blueprint"
version = "0.0.1"
description = "Deployment tooling for the Fabric DataOps Blueprint"
requires-python = ">=3.12"
dependencies = [
    "fabric-cicd==1.3.0",
    "azure-identity>=1.17",
    "requests>=2.32",
    "dbt-fabric==1.11.1",
    "pyyaml>=6",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 120
# Fabric notebook source files run inside the Fabric runtime, where `spark` and
# `notebookutils` are ambient globals — they are not standalone Python modules.
extend-exclude = ["*.Notebook"]

[tool.ruff.lint]
# flake8-bandit: the security ruleset, in place of a separate SAST tool. Semgrep
# was tried against this code and found nothing these rules do not cover.
extend-select = ["S"]

[tool.ruff.lint.per-file-ignores]
# Asserting is what a test does, and a test that shells out to `sys.executable`
# is running this repository's own code.
"tests/*" = ["S101", "S603"]

[tool.pytest.ini_options]
testpaths = ["tests"]
