# The cross-solution data contract, wired explicitly: finance's shortcut points
# at sales' gold. The producer is named by the placeholder in
# shortcuts.metadata.json; deploy.py resolves that solution's workspace and
# warehouse for whichever environment is being deployed and exports the two IDs,
# so no identifier from anyone's tenant is committed here. A fork works unedited.
find_replace:
    - find_value: "SALES_WORKSPACE_ID"
      replace_value:
        dev: "$ENV:SALES_WORKSPACE_ID"
        test: "$ENV:SALES_WORKSPACE_ID"
        prod: "$ENV:SALES_WORKSPACE_ID"
      file_path: "/lh_finance.Lakehouse/shortcuts.metadata.json"
    - find_value: "SALES_WAREHOUSE_ITEM_ID"
      replace_value:
        dev: "$ENV:SALES_WAREHOUSE_ITEM_ID"
        test: "$ENV:SALES_WAREHOUSE_ITEM_ID"
        prod: "$ENV:SALES_WAREHOUSE_ITEM_ID"
      file_path: "/lh_finance.Lakehouse/shortcuts.metadata.json"
