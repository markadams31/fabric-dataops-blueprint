# Environment rebinding for values Fabric cannot auto-bind (see the official
# dependency-binding matrix): the semantic model's Direct Lake connection.
# Placeholders in model.tmdl become the target workspace's real endpoint and
# warehouse at deploy time via fabric-cicd dynamic variables.
find_replace:
    - find_value: "SALES_WAREHOUSE_ENDPOINT"
      replace_value:
        dev: "$items.Warehouse.wh_analytics.$sqlendpoint"
        test: "$items.Warehouse.wh_analytics.$sqlendpoint"
        prod: "$items.Warehouse.wh_analytics.$sqlendpoint"
      file_path: "/sm_sales.SemanticModel/definition/model.tmdl"
    - find_value: "SALES_WAREHOUSE_ID"
      replace_value:
        dev: "$items.Warehouse.wh_analytics.$id"
        test: "$items.Warehouse.wh_analytics.$id"
        prod: "$items.Warehouse.wh_analytics.$id"
      file_path: "/sm_sales.SemanticModel/definition/model.tmdl"
    # Whether the ingestion schedule is live. Fabric's own .schedules file is one
    # file for every environment, so which environments actually run it is a
    # definition-level rewrite like any other.
    - find_value: '"enabled": false'
      replace_value:
        dev: '"enabled": false'
        test: '"enabled": false'
        prod: '"enabled": true'
      file_path: "/nb_ingest_orders.Notebook/.schedules"
