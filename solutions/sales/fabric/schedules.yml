# Triggers, versioned and deployed with the solution.
#
# A schedule is not part of an item definition: the REST API carries item
# content only, so fabric-cicd cannot publish one. Under Git integration or
# deployment pipelines Fabric moves schedules for you; on an API-driven release
# you manage them by code, which is what deploy.py does with this file — on
# every deploy, to every environment, from the same bundle.
schedules:
  - item: nb_ingest_orders
    item_type: Notebook
    job_type: RunNotebook
    configuration:
      type: Cron
      interval: 1440                       # minutes — daily
      startDateTime: "2026-01-01T18:00:00"
      endDateTime: "2030-01-01T18:00:00"
      localTimeZoneId: "UTC"
    # Deployed but disabled, because this demo pauses its capacity nightly:
    # Fabric auto-disables a scheduler after roughly ten consecutive failures,
    # and a schedule that fires at a paused capacity fails every time. On an
    # always-on capacity set prod to true — that is the whole switch, and the
    # scheduled workflow then only rebuilds the marts.
    enabled:
      dev: false
      test: false
      prod: false
