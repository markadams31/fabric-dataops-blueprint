# Secret-free, resolved at deploy time: the deploy job discovers the warehouse's
# SQL endpoint from the Fabric API and exports these variables. Authentication is
# whatever `az login` established — you locally, the deploy identity in CI.
warehouse:
  target: fabric
  outputs:
    fabric:
      type: fabric
      server: "{{ env_var('DBT_FABRIC_SERVER') }}"
      port: 1433
      database: "{{ env_var('DBT_FABRIC_DATABASE') }}"
      schema: dbt
      authentication: "{{ env_var('DBT_FABRIC_AUTH', 'CLI') }}"
      threads: 4
      query_timeout: 120
      retries: 2
