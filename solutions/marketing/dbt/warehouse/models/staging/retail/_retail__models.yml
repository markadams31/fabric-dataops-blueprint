version: 2

models:
  - name: stg_retail__customers
    columns:
      - name: customer_id
        tests: [unique, not_null]
  - name: stg_retail__orders
    columns:
      - name: order_id
        tests: [unique, not_null]
      - name: customer_id
        tests: [not_null]
  - name: stg_retail__payments
    columns:
      - name: payment_id
        tests: [unique, not_null]
